<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">

    <title>PROMYX | Beyond Boundaries</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        header {
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .logo {
            color: #d4af37;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .hero h1 {
            font-size: clamp(42px, 8vw, 75px);
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #d4af37;
        }

        .hero p {
            color: #aaa;
            font-size: 18px;
            max-width: 550px;
            line-height: 1.7;
        }

        .tagline {
            margin-top: 35px;
            color: #d4af37;
            letter-spacing: 4px;
            font-size: 13px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">PROMYX</div>
    </header>

    <main class="hero">
        <h1>Think <span>Beyond.</span></h1>

        <p>
            A new vision. A new possibility.
            We're building something bigger,
            designed to connect ideas with opportunities.
        </p>

        <div class="tagline">
            BEYOND BOUNDARIES.
        </div>
    </main>

    <footer>
        &copy; 2026 PROMYX. All rights reserved.
    </footer>

</body>
</html>
